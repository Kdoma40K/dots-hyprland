<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rotating slot on desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
@font-face{font-family:"Departure Mono";src:url(/_blob/7d3ac510b9f6b5da546b643f23b28875) format("woff2");font-weight:400}
@font-face{font-family:"DSEG7";src:url(/_blob/cc10ec782d92c0f7b368251eb318d606) format("woff2");font-weight:700}
body{margin:0}
@keyframes np-pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes np-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; color: #111111; font-family: 'IBM Plex Mono', monospace">
<dc-import name="DesktopKit" wall="/_blob/dafd61a0857a64b20011e4c32f4dcf7e" mode="light" signal="#bc3830" trace="#76605d" tint="#f5eceb" tint2="#e8dfde" panel="none" side="left" greebles="{{ true }}" extras="{{ true }}" viz="scope" label="P1 · ROTATING SLOT" hint-size="1920px,1080px"></dc-import>

<div onWheel="{{onWheel}}" style="position: absolute; right: 28px; top: 586px; width: 360px; height: 96px; box-sizing: border-box; border-radius: 16px; background: #f5eceb; border: 1px solid rgba(17,17,17,0.16); overflow: hidden">
<sc-if value="{{showDsn}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-family: 'Departure Mono', monospace; animation: np-in 260ms cubic-bezier(.2,.8,.2,1)">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span>DSN // 6 LINKS</span><span style="color: #555555">GDS 2 · MAD 2 · CAN 2</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="color: #bc3830; font-size: 14px; animation: np-pulse 1.4s ease-in-out infinite">▼</span><span style="font-size: 15px">VOYAGER 1</span><span style="font-size: 11px; color: #555555">DSS-14 · X-BAND</span></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #555555"><span>RTLT ~[47] H</span><span>[160] B/S</span><span>FARTHEST</span></div>
</div>
</sc-if>
<sc-if value="{{showPkg}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; align-items: center; gap: 16px; animation: np-in 260ms cubic-bezier(.2,.8,.2,1)">
<span style="position: relative; display: inline-block; font-family: 'DSEG7', monospace; font-weight: 700; font-size: 40px; line-height: 1"><span style="position: absolute; left: 0; top: 0; color: rgba(17,17,17,0.08)">888</span><span style="position: relative">014</span></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; font-family: 'Departure Mono', monospace; font-size: 12px"><span>PKG // 14 PENDING</span><span style="color: #555555">REPO 11 · AUR 3 · 412 MB</span><div style="display: flex; height: 6px; gap: 2px"><span style="flex-grow: 11; background: #111111"></span><span style="flex-grow: 3; background: #76605d"></span></div></div>
</div>
</sc-if>
<sc-if value="{{showLaunch}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; background: #ffffff; animation: np-in 260ms cubic-bezier(.2,.8,.2,1)">
<div style="flex-grow: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-family: 'Departure Mono', monospace; font-size: 11px; color: #555555"><span>NEXT LAUNCH</span><span>LL2</span></div><span style="font-family: 'DSEG7', monospace; font-weight: 700; font-size: 24px">T-02:14:33</span><span style="font-family: 'Departure Mono', monospace; font-size: 12px">[MISSION NAME]</span></div>
<div style="width: 26px; border-left: 2px dashed #b7b0a5; background: #bc3830"></div>
</div>
</sc-if>
</div>
<div style="position: absolute; right: 28px; top: 688px; width: 360px; display: flex; justify-content: space-between; align-items: center; font-family: 'Departure Mono', monospace; font-size: 10px; color: #555555">
<span style="display: flex; gap: 6px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="width: {{d.w}}; height: 4px; background: {{d.c}}; transition: width 200ms ease-out"></span></sc-for></span>
<span style="display: flex; align-items: center; gap: 8px"><span>{{slotN}} / 3 · SCROLL</span><button onClick="{{prev}}" aria-label="Previous widget" style="width: 22px; height: 18px; border: 1px solid rgba(17,17,17,0.25); border-radius: 5px; background: #f5eceb; font-family: 'Departure Mono', monospace; font-size: 11px; color: #111111; padding: 0; line-height: 1">‹</button><button onClick="{{next}}" aria-label="Next widget" style="width: 22px; height: 18px; border: 1px solid rgba(17,17,17,0.25); border-radius: 5px; background: #f5eceb; font-family: 'Departure Mono', monospace; font-size: 11px; color: #111111; padding: 0; line-height: 1">›</button></span>
</div>

<div style="position: absolute; left: 236px; top: 16px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; background: rgba(245,236,235,0.94); border: 1px solid #bc3830; font-family: 'Departure Mono', monospace; font-size: 12px">
<span style="width: 18px; height: 7px; background: repeating-linear-gradient(-45deg, #ff5a1f 0 3px, transparent 3px 6px)"></span><span>PKG 14 · NEWS HOLD</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const i = ((this.state && this.state.i) || 0);
const go = (d) => () => this.setState({ i: (i + d + 3) % 3, lastWheel: Date.now() });
const onWheel = (e) => {
const now = Date.now();
if (this.state && this.state.lastWheel && now - this.state.lastWheel < 250) return;
this.setState({ i: (i + (e.deltaY > 0 ? 1 : -1) + 3) % 3, lastWheel: now });
};
return {
prev: go(-1), next: go(1), onWheel: onWheel,
showDsn: i === 0, showPkg: i === 1, showLaunch: i === 2, slotN: i + 1,
dots: [0, 1, 2].map((k) => ({ w: k === i ? '22px' : '8px', c: k === i ? '#bc3830' : 'rgba(17,17,17,0.25)' }))
};
}
}
</script>
</body>
</html>
